[package]
name = "domainnameapi"
version = "2.0.0"
edition = "2021"
rust-version = "1.83"
description = "Typed async SDK for the Domain Name API reseller REST API: domains, contacts, DNS, DNSSEC, SSL, hosting, orders and products"
license = "Apache-2.0"
repository = "https://github.com/domainreseller/rust-dna"
homepage = "https://www.domainnameapi.com"
documentation = "https://docs.rs/domainnameapi"
readme = "README.md"
keywords = ["domain", "registrar", "dns", "ssl", "reseller"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
exclude = ["/.github", "/tests/testdata", "/README-*.md", "/AGENTS.md", "/CLAUDE.md"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.38", default-features = false, features = ["std", "serde"] }
futures-util = { version = "0.3.30", default-features = false, features = ["std"] }
httpdate = "1"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38", default-features = false, features = ["time"] }

[dev-dependencies]
futures-util = { version = "0.3.30", default-features = false, features = ["std"] }
tokio = { version = "1.38", default-features = false, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
